name: Android handbook build and release

on:
  push:
    branches:
      - main
    paths:
      - "android-handbook/**"
      - ".github/workflows/android-handbook.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-handbook/**"
      - ".github/workflows/android-handbook.yml"

permissions:
  contents: write

concurrency:
  group: android-handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-handbook
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK Platform 37.2
        run: sdkmanager "platforms;android-37.2"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK for pull request inspection
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-pocket-guide-debug
          path: android-handbook/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct-download debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Swift-Pocket-Guide-v1.1.1-debug.apk

      - name: Publish debug APK as a direct GitHub Release asset
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swift-pocket-guide-v1.1.1
          target_commitish: ${{ github.sha }}
          name: Swift Pocket Guide v1.1.1
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android-handbook/Swift-Pocket-Guide-v1.1.1-debug.apk

      - name: Prepare persistent release signing key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        working-directory: .
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/swift-pocket-guide-release.jks
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload signed APK to GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swift-pocket-guide-v1.1.1
          target_commitish: ${{ github.sha }}
          name: Swift Pocket Guide v1.1.1
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android-handbook/app/build/outputs/apk/release/*.apk

      - name: Explain missing release signing key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !(env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '') }}
        run: echo "Debug APK published as a direct download. Signed release is skipped until Android signing secrets are configured."
