name: Android handbook build

on:
  push:
    branches:
      - feature/android-swift-pocket-guide
    paths:
      - "android-handbook/**"
      - ".github/workflows/android-handbook.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-handbook/**"
      - ".github/workflows/android-handbook.yml"

permissions:
  contents: read

concurrency:
  group: android-handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-handbook
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK Platform 37.2
        run: sdkmanager "platforms;android-37.2"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: swift-pocket-guide-debug
          path: android-handbook/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
