name: Android handbook build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-handbook/**"
      - "android-swift-runtime/**"
      - ".github/workflows/android-handbook.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-handbook/**"
      - ".github/workflows/android-handbook.yml"

permissions:
  contents: write

concurrency:
  group: android-handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-handbook
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK Platform 37.2
        run: sdkmanager "platforms;android-37.2"

      - name: Restore stable preview signing key
        run: |
          set -euo pipefail
          base64 --decode ci/debug.keystore.b64 > ci/debug.keystore
          keytool -list -keystore ci/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Install Swift 6.4.2 with Swiftly
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          curl -fSL https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -xzf "$RUNNER_TEMP/swiftly.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use 6.4.2
          swift --version
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Swift SDK for Android and NDK 30
        working-directory: .
        run: |
          set -euo pipefail
          swift sdk install https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
          curl -fSL -o "$RUNNER_TEMP/android-ndk-r30.zip" https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk-r30.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++"

      - name: Cross-compile Swift runtime for Redmi-class ARM64 Android
        working-directory: .
        run: |
          set -euo pipefail
          swift --version
          swift sdk list
          cd android-swift-runtime
          swift build --configuration release --swift-sdk swift-6.4.2-RELEASE_android --triple aarch64-unknown-linux-android30 --static-swift-stdlib --product SwiftAndroidRuntime
          cd ..
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          SWIFT_LIB="$PWD/android-swift-runtime/.build/aarch64-unknown-linux-android30/release"
          mkdir -p android-handbook/app/src/main/jniLibs/arm64-v8a
          cp "$SWIFT_LIB/libSwiftAndroidRuntime.so" android-handbook/app/src/main/jniLibs/arm64-v8a/
          "$NDK_BIN/aarch64-linux-android30-clang++" -shared -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            android-handbook/app/src/main/cpp/swift_bridge.cpp \
            -L"$SWIFT_LIB" -L"$NDK_SYSROOT/usr/lib/aarch64-linux-android" \
            -lSwiftAndroidRuntime -lc++_shared \
            -o android-handbook/app/src/main/jniLibs/arm64-v8a/libswiftbridge.so
          cp "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" android-handbook/app/src/main/jniLibs/arm64-v8a/
          readelf -h android-handbook/app/src/main/jniLibs/arm64-v8a/libSwiftAndroidRuntime.so | grep -q 'AArch64'
          readelf -h android-handbook/app/src/main/jniLibs/arm64-v8a/libswiftbridge.so | grep -q 'AArch64'
          ls -lh android-handbook/app/src/main/jniLibs/arm64-v8a/

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK for pull request inspection
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-pocket-guide-preview
          path: android-handbook/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct-download preview APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Swift-Pocket-Guide-v1.1.5-preview.apk

      - name: Publish preview APK as a direct GitHub Release asset
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swift-pocket-guide-v1.1.5
          target_commitish: ${{ github.sha }}
          name: Swift Pocket Guide v1.1.5
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android-handbook/Swift-Pocket-Guide-v1.1.4-preview.apk

      - name: Prepare persistent release signing key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        working-directory: .
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/swift-pocket-guide-release.jks
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload signed APK to GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swift-pocket-guide-v1.1.4
          target_commitish: ${{ github.sha }}
          name: Swift Pocket Guide v1.1.4
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android-handbook/app/build/outputs/apk/release/*.apk

      - name: Explain missing release signing key
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !(env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '') }}
        run: echo "Installable preview APK published with a stable preview key. Production-signed release is skipped until production signing secrets are configured."
